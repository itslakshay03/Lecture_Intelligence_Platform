version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lectraai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      - AUTO_MIGRATE_LEGACY_TASKS=true
    volumes:
      # CRITICAL: Persistent volume mount for SQLite database.
      # If this mount is omitted, tasks.db and user accounts will be destroyed when the container restarts!
      - lectraai_db_data:/app/data
      # CRITICAL: Persistent volume mount for generated study pack JSONs and PDF documents.
      - lectraai_output_data:/app/output

volumes:
  lectraai_db_data:
    driver: local
  lectraai_output_data:
    driver: local
